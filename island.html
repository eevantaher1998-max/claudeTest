<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firefly Island</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#9fd3ea}
#hud{position:fixed;top:12px;left:16px;color:#fff;text-shadow:0 1px 3px #000;font-size:1.1rem}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-shadow:0 2px 6px #000;text-align:center;background:rgba(0,0,0,.25);cursor:pointer}
#msg h1{margin:0 0 8px;font-weight:300;letter-spacing:.1em}
</style></head><body>
<div id="hud">Fireflies: <b id="got">0</b>/10 · <span id="time">0.0</span>s</div>
<div id="msg"><h1>FIREFLY ISLAND</h1><p>Catch all 10 fireflies hidden around the island.<br>
WASD / arrows to walk · Shift to run · drag the mouse to look · N nuke · M meteor<br><br>Click to start</p></div>
<div id="flash" style="position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R = 55, TOTAL = 10;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ea);
scene.fog = new THREE.Fog(0x9fd3ea, 20, 90);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 900);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a5f2a, 0.8));
const sun = new THREE.DirectionalLight(0xfff2d0, 0.8);
sun.position.set(30, 50, 20); scene.add(sun);

// Rolling hills that sink into the sea at the island's edge
function height(x, z) {
  const d = Math.hypot(x, z);
  return Math.sin(x * 0.1) * Math.cos(z * 0.12) * 2 + Math.sin(x * 0.05 + z * 0.07) * 1.5
       + 1.5 - Math.max(0, d - R + 12) * 0.35;
}

const ground = new THREE.PlaneGeometry(160, 160, 120, 120);
ground.rotateX(-Math.PI / 2);
const pos = ground.attributes.position, colors = [];
const sand = new THREE.Color(0xe6d59a), grass = new THREE.Color(0x5f9e3c), dark = new THREE.Color(0x3f7a2a);
for (let i = 0; i < pos.count; i++) {
  const y = height(pos.getX(i), pos.getZ(i));
  pos.setY(i, y);
  const c = y < 0.6 ? sand : grass.clone().lerp(dark, Math.min(1, Math.max(0, (y - 1) / 3)));
  colors.push(c.r, c.g, c.b);
}
ground.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
ground.computeVertexNormals();
scene.add(new THREE.Mesh(ground, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));

const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
  new THREE.MeshLambertMaterial({ color: 0x3f8fc4, transparent: true, opacity: 0.85 }));
water.rotation.x = -Math.PI / 2; scene.add(water);

// Random spot on dry land, away from the spawn point
function landSpot(minH = 0.8) {
  for (;;) {
    const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * (R - 14);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (height(x, z) > minH) return [x, z];
  }
}

// Trees (trunk + two leaf cones), rocks and flowers share geometry for speed
const trunkG = new THREE.CylinderGeometry(0.2, 0.3, 2, 6), leafG = new THREE.ConeGeometry(1.4, 2.6, 7);
const trunkM = new THREE.MeshLambertMaterial({ color: 0x6b4a2b });
const leafM = [0x2e6b2f, 0x3b7d34, 0x285c2a].map(c => new THREE.MeshLambertMaterial({ color: c, flatShading: true }));
const obstacles = [];
for (let i = 0; i < 140; i++) {
  const [x, z] = landSpot(), y = height(x, z), s = 0.7 + Math.random() * 0.8;
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(trunkG, trunkM); trunk.position.y = 1;
  const m = leafM[i % 3];
  const l1 = new THREE.Mesh(leafG, m); l1.position.y = 2.8;
  const l2 = new THREE.Mesh(leafG, m); l2.position.y = 4; l2.scale.setScalar(0.75);
  tree.add(trunk, l1, l2); tree.position.set(x, y - 0.1, z); tree.scale.setScalar(s);
  tree.rotation.y = Math.random() * 6; scene.add(tree);
  obstacles.push({ x, z, r: 0.6 * s });
}
const rockG = new THREE.DodecahedronGeometry(1, 0), rockM = new THREE.MeshLambertMaterial({ color: 0x8a8a84, flatShading: true });
for (let i = 0; i < 40; i++) {
  const [x, z] = landSpot(0.2), s = 0.4 + Math.random() * 1.1;
  const rock = new THREE.Mesh(rockG, rockM);
  rock.position.set(x, height(x, z), z); rock.scale.set(s, s * 0.7, s); rock.rotation.set(Math.random(), Math.random(), 0);
  scene.add(rock); obstacles.push({ x, z, r: s * 0.9 });
}
const flowerG = new THREE.SphereGeometry(0.12, 5, 4);
const flowerM = [0xff6b8a, 0xffe066, 0xffffff, 0xb38cff].map(c => new THREE.MeshBasicMaterial({ color: c }));
for (let i = 0; i < 300; i++) {
  const [x, z] = landSpot(), f = new THREE.Mesh(flowerG, flowerM[i % 4]);
  f.position.set(x, height(x, z) + 0.12, z); scene.add(f);
}

// Fireflies: glowing orbs with a soft halo that bob and drift
const flyG = new THREE.SphereGeometry(0.18, 8, 6), haloG = new THREE.SphereGeometry(0.45, 8, 6);
const flyM = new THREE.MeshBasicMaterial({ color: 0xfff27a });
const haloM = new THREE.MeshBasicMaterial({ color: 0xfff27a, transparent: true, opacity: 0.3 });
let flies = [];
function spawnFlies() {
  flies.forEach(f => scene.remove(f.mesh));
  flies = Array.from({ length: TOTAL }, () => {
    const [x, z] = landSpot(), mesh = new THREE.Mesh(flyG, flyM);
    mesh.add(new THREE.Mesh(haloG, haloM)); scene.add(mesh);
    return { mesh, x, z, phase: Math.random() * 6 };
  });
}

// Distant nuclear blast out at sea: flash, fireball, rising mushroom cloud, shockwave.
// fog:false keeps it visible beyond the island's fog.
const SKY = new THREE.Color(0x9fd3ea), GLOW = new THREE.Color(0xffb070);
const blastMat = c => new THREE.MeshBasicMaterial({ color: c, fog: false, transparent: true });
const blast = new THREE.Group(); blast.position.set(0, 0, -160); blast.visible = false; scene.add(blast);
const fireball = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), blastMat(0xfff4c0));
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1, 1, 16, 1, true), blastMat(0x9a7a62));
const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), blastMat(0xff8a3a));
const skirt = new THREE.Mesh(new THREE.TorusGeometry(1, 0.25, 8, 32), blastMat(0xc9a88a));
const wave = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 96), blastMat(0xffffff));
wave.rotation.x = skirt.rotation.x = -Math.PI / 2; wave.position.y = 0.3;
blast.add(fireball, stem, cap, skirt, wave);
const flash = document.getElementById('flash');
const capColor = [new THREE.Color(0xff8a3a), new THREE.Color(0x6e5c52)];
let blastT = -1, shake = 0, waveHit = false;
const fx = { glow: 0, dark: 0, nukeFlash: 0, rockFlash: 0 };  // shared sky/flash state

function detonate() { blastT = 0; waveHit = false; blast.visible = true; }

function updateBlast(dt) {
  if (blastT < 0) return;
  const t = (blastT += dt), e = 1 - Math.pow(1 - Math.min(1, t / 8), 3);  // ease-out growth
  const h = 8 + e * 60, fade = Math.max(0, 1 - Math.max(0, t - 20) / 12);
  fx.nukeFlash = Math.max(0, 1 - t * 1.2);
  fx.glow = Math.max(0, 0.7 - t * 0.08);
  fireball.scale.setScalar(6 + e * 8); fireball.position.y = h;
  fireball.material.opacity = Math.max(0, 1 - t / 6);
  cap.scale.set(10 + e * 16, 7 + e * 9, 10 + e * 16); cap.position.y = h;
  cap.material.color.copy(capColor[0]).lerp(capColor[1], Math.min(1, t / 10));
  skirt.scale.setScalar(12 + e * 18); skirt.position.y = h - 6 - e * 4;
  stem.scale.set(3 + e * 3, h, 3 + e * 3); stem.position.y = h / 2;
  [cap, stem, skirt].forEach(m => m.material.opacity = fade);
  const radius = t * 45;                       // shockwave spreading over the sea
  wave.scale.setScalar(radius); wave.material.opacity = Math.max(0, 1 - radius / 260);
  if (!waveHit && radius > Math.hypot(player.x, player.z + 160)) { waveHit = true; shake = 1.2; }
  if (fade === 0) { blastT = -1; blast.visible = false; fx.glow = fx.nukeFlash = 0; }
}

// The Chicxulub impactor: a ~10 km rock (about Manhattan-sized) that ended the dinosaurs.
// It streaks in over 4 s, hits the sea far to the east, and dust darkens the sky for a while.
const IMPACT = new THREE.Vector3(260, 0, -140), FROM = new THREE.Vector3(-150, 420, -320);
const DUST = new THREE.Color(0x4a3a36);
const meteor = new THREE.Group(); meteor.visible = false; scene.add(meteor);
const rockBody = new THREE.Mesh(new THREE.DodecahedronGeometry(12, 1), blastMat(0x3b2a22));
const heat = new THREE.Mesh(new THREE.SphereGeometry(17, 16, 12), blastMat(0xffa040));
heat.material.opacity = 0.5;
const tailG = new THREE.ConeGeometry(16, 180, 16, 1, true); tailG.rotateX(Math.PI / 2); tailG.translate(0, 0, 90);
const tail = new THREE.Mesh(tailG, blastMat(0xff7a2a)); tail.material.opacity = 0.55;
meteor.add(rockBody, heat, tail);
const crater = new THREE.Group(); crater.position.copy(IMPACT); crater.visible = false; scene.add(crater);
const dome = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), blastMat(0xffffff));
const plume = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1, 1, 20, 1, true), blastMat(0x5a4a44));
const quake = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 128), blastMat(0xffd0a0));
quake.rotation.x = -Math.PI / 2; quake.position.y = 0.4;
crater.add(dome, plume, quake);
const domeColor = [new THREE.Color(0xffffff), new THREE.Color(0xff6a20), new THREE.Color(0x3a2e2a)];
let rockT = -1, quakeHit = false;

function launchMeteor() { rockT = 0; quakeHit = false; meteor.visible = true; crater.visible = false; }

function updateMeteor(dt) {
  if (rockT < 0) return;
  const t = (rockT += dt), FALL = 4;
  if (t < FALL) {                                 // falling: accelerate toward the sea
    meteor.position.copy(FROM).lerp(IMPACT, (t / FALL) ** 2);
    meteor.lookAt(FROM); rockBody.rotation.x += dt * 2;
    fx.glow = Math.max(fx.glow, t / FALL * 0.3);
    return;
  }
  const a = t - FALL, e = 1 - Math.pow(1 - Math.min(1, a / 12), 3);
  meteor.visible = false; crater.visible = true;
  if (blastT < 0) fx.glow = 0;                    // clear the fall's glow unless the nuke owns it
  fx.rockFlash = Math.max(0, 1 - a * 0.6);
  fx.dark = Math.min(0.85, a * 0.12) * Math.max(0, 1 - Math.max(0, a - 40) / 20);
  dome.scale.set(20 + e * 140, 10 + e * 90, 20 + e * 140);
  dome.material.color.copy(domeColor[0]).lerp(domeColor[1], Math.min(1, a / 2));
  if (a > 2) dome.material.color.lerp(domeColor[2], Math.min(1, (a - 2) / 10));
  plume.scale.set(15 + e * 25, 20 + e * 260, 15 + e * 25); plume.position.y = plume.scale.y / 2;
  const radius = a * 70;                          // bigger, faster shockwave than the nuke
  quake.scale.setScalar(radius); quake.material.opacity = Math.max(0, 1 - radius / 500);
  if (!quakeHit && radius > Math.hypot(player.x - IMPACT.x, player.z - IMPACT.z)) { quakeHit = true; shake = 3; }
  const fade = Math.max(0, 1 - Math.max(0, a - 35) / 25);
  dome.material.opacity = plume.material.opacity = fade;
  if (fade === 0) { rockT = -1; crater.visible = false; fx.dark = fx.rockFlash = 0; }
}

// Player state and controls
const player = { x: 0, z: 0, yaw: 0, pitch: 0 };
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyN') detonate(); if (e.code === 'KeyM') launchMeteor(); });
addEventListener('keyup', e => keys[e.code] = false);
let dragging = false, lastX = 0, lastY = 0;
addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  player.yaw -= (e.clientX - lastX) * 0.005;
  player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});

let playing = false, got = 0, startTime = 0;
const msg = document.getElementById('msg'), gotEl = document.getElementById('got'), timeEl = document.getElementById('time');
msg.onclick = () => {
  Object.assign(player, { x: 0, z: 0, yaw: 0, pitch: 0 });
  got = 0; gotEl.textContent = 0; spawnFlies();
  startTime = performance.now(); playing = true; msg.style.display = 'none';
  setTimeout(detonate, 8000);   // it goes off on its own a few seconds in
  setTimeout(launchMeteor, 30000);
};

function blocked(x, z) {
  if (Math.hypot(x, z) > R - 6 || height(x, z) < -0.3) return true;  // stay on the island
  return obstacles.some(o => Math.hypot(x - o.x, z - o.z) < o.r + 0.4);
}

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (playing) {
    const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const speed = (keys.ShiftLeft || keys.ShiftRight ? 12 : 6) * dt;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const nx = player.x + (-sin * fwd + cos * side) * speed;
    const nz = player.z + (-cos * fwd - sin * side) * speed;
    if (!blocked(nx, player.z)) player.x = nx;   // slide along obstacles
    if (!blocked(player.x, nz)) player.z = nz;

    for (const f of flies) {
      if (!f.mesh.visible) continue;
      if (Math.hypot(player.x - f.x, player.z - f.z) < 1.4) {
        f.mesh.visible = false; gotEl.textContent = ++got;
        if (got === TOTAL) {
          playing = false; msg.style.display = 'flex';
          msg.innerHTML = `<h1>ALL CAUGHT</h1><p>You found every firefly in ${timeEl.textContent}s.<br><br>Click to play again</p>`;
        }
      }
    }
    timeEl.textContent = ((performance.now() - startTime) / 1000).toFixed(1);
  }
  for (const f of flies) {
    f.mesh.position.set(f.x + Math.sin(t + f.phase) * 0.4, height(f.x, f.z) + 1.3 + Math.sin(t * 2 + f.phase) * 0.3, f.z);
    f.mesh.children[0].scale.setScalar(1 + Math.sin(t * 4 + f.phase) * 0.25);
  }
  water.position.y = Math.sin(t * 0.8) * 0.05;
  updateBlast(dt); updateMeteor(dt);
  flash.style.opacity = Math.max(fx.nukeFlash, fx.rockFlash);
  scene.background.copy(SKY).lerp(DUST, fx.dark).lerp(GLOW, fx.glow);
  scene.fog.color.copy(scene.background);
  sun.intensity = 0.8 * (1 - fx.dark * 0.8);
  camera.position.set(player.x, height(player.x, player.z) + 1.7, player.z);
  if (shake > 0) {
    shake -= dt;
    camera.position.x += (Math.random() - 0.5) * shake * 0.6;
    camera.position.y += (Math.random() - 0.5) * shake * 0.6;
  }
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
spawnFlies(); loop();
</script></body></html>
