<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chroma Drift</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden;
    font-family: system-ui, sans-serif; color: #eee; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex;
    justify-content: space-between; pointer-events: none; mix-blend-mode: difference; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  #msg h1 { font-weight: 200; letter-spacing: .3em; margin: 0 0 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">0</span><span id="time">60</span></div>
<div id="msg"><h1>CHROMA DRIFT</h1><p>Move to paint. Touch the orbs to absorb their color.<br>Avoid the black voids. 60 seconds.<br><br>Click to begin</p></div>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time');
const msg = document.getElementById('msg');
let W, H, p, orbs, voids, score, hue, t0, running = false;

function resize() { W = c.width = innerWidth; H = c.height = innerHeight; x.fillStyle = '#0b0b10'; x.fillRect(0, 0, W, H); }
addEventListener('resize', resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const spawn = r => ({ x: rnd(r, W - r), y: rnd(r, H - r), vx: rnd(-1, 1), vy: rnd(-1, 1), r, h: rnd(0, 360) });

function start() {
  resize();
  p = { x: W / 2, y: H / 2, tx: W / 2, ty: H / 2, size: 6 };
  orbs = Array.from({ length: 6 }, () => spawn(14));
  voids = Array.from({ length: 3 }, () => spawn(22));
  score = 0; hue = 200; t0 = performance.now(); running = true;
  msg.style.display = 'none';
  requestAnimationFrame(loop);
}

function aim(e) { const q = e.touches ? e.touches[0] : e; if (p) { p.tx = q.clientX; p.ty = q.clientY; } }
addEventListener('pointermove', aim); addEventListener('touchmove', aim);
msg.addEventListener('click', start);

function drift(o, speed) {
  o.x += o.vx * speed; o.y += o.vy * speed;
  if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
  if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
}

function loop(now) {
  if (!running) return;
  const left = Math.max(0, 60 - (now - t0) / 1000);
  timeEl.textContent = Math.ceil(left);

  // brush follows pointer, leaving a permanent trail
  const px = p.x, py = p.y;
  p.x += (p.tx - p.x) * 0.12; p.y += (p.ty - p.y) * 0.12;
  hue = (hue + 0.4) % 360;
  x.strokeStyle = `hsla(${hue},85%,60%,0.7)`;
  x.lineWidth = p.size; x.lineCap = 'round';
  x.beginPath(); x.moveTo(px, py); x.lineTo(p.x, p.y); x.stroke();

  // faint veil so orbs/voids leave ghostly trails
  x.fillStyle = 'rgba(11,11,16,0.015)'; x.fillRect(0, 0, W, H);

  const speed = 1 + (60 - left) / 20;
  for (const o of orbs) {
    drift(o, speed);
    x.fillStyle = `hsla(${o.h},90%,65%,0.25)`;
    x.beginPath(); x.arc(o.x, o.y, o.r, 0, 7); x.fill();
    if (Math.hypot(o.x - p.x, o.y - p.y) < o.r + p.size) {
      score++; scoreEl.textContent = score;
      hue = o.h; p.size = Math.min(40, p.size + 2);
      // bloom: a burst of rings in the orb's color
      for (let i = 1; i <= 5; i++) {
        x.strokeStyle = `hsla(${o.h + i * 20},90%,60%,${0.5 / i})`; x.lineWidth = 2;
        x.beginPath(); x.arc(o.x, o.y, i * 18, 0, 7); x.stroke();
      }
      Object.assign(o, spawn(14));
    }
  }
  for (const v of voids) {
    drift(v, speed * 0.8);
    x.fillStyle = 'rgba(0,0,0,0.35)';
    x.beginPath(); x.arc(v.x, v.y, v.r, 0, 7); x.fill();
    if (Math.hypot(v.x - p.x, v.y - p.y) < v.r + p.size / 2) {
      p.size = Math.max(4, p.size - 1);   // void shrinks your brush
      score = Math.max(0, score - 1); scoreEl.textContent = score;
    }
  }

  if (left <= 0) {
    running = false;
    msg.style.display = 'flex';
    msg.innerHTML = `<h1>${score}</h1><p>Your painting is finished.<br><br>Click to paint again</p>`;
    msg.style.background = 'rgba(11,11,16,0.25)';
    return;
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
