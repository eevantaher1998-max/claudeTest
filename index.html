<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click the Dot</title>
<style>
  :root { --bg: #f4f4f7; --fg: #1d1d24; --dot: #e8465a; --panel: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161c; --fg: #ececf1; --dot: #ff6b7d; --panel: #22222b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; display: flex; flex-direction: column;
    align-items: center; padding: 16px;
  }
  h1 { margin: 8px 0; }
  #hud { display: flex; gap: 24px; font-size: 1.2rem; margin-bottom: 12px; }
  #arena {
    position: relative; width: 100%; max-width: 600px; aspect-ratio: 4 / 3;
    background: var(--panel); border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  #dot {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: var(--dot); cursor: pointer; display: none; border: none;
  }
  #start {
    margin-top: 16px; font-size: 1.1rem; padding: 10px 24px; border-radius: 8px;
    border: none; background: var(--dot); color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Click the Dot</h1>
  <div id="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Time: <b id="time">30</b>s</span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div id="arena"><button id="dot" aria-label="dot"></button></div>
  <button id="start">Start</button>

<script>
  const GAME_SECONDS = 30;
  const arena = document.getElementById('arena');
  const dot = document.getElementById('dot');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('start');

  let score = 0, timeLeft = GAME_SECONDS, timer = null;
  let best = 0;
  try { best = Number(localStorage.getItem('dotBest')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function moveDot() {
    const maxX = arena.clientWidth - dot.offsetWidth;
    const maxY = arena.clientHeight - dot.offsetHeight;
    dot.style.left = Math.random() * maxX + 'px';
    dot.style.top = Math.random() * maxY + 'px';
  }

  function start() {
    score = 0; timeLeft = GAME_SECONDS;
    scoreEl.textContent = score; timeEl.textContent = timeLeft;
    startBtn.disabled = true;
    dot.style.display = 'block';
    moveDot();
    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    clearInterval(timer);
    dot.style.display = 'none';
    startBtn.disabled = false;
    startBtn.textContent = 'Play again';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('dotBest', best); } catch (e) {}
    }
    alert('Time\'s up! You scored ' + score + '.');
  }

  dot.addEventListener('click', () => {
    score++;
    scoreEl.textContent = score;
    moveDot();
  });
  startBtn.addEventListener('click', start);
</script>
</body>
</html>
