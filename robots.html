<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot World</title>
<style>
body{margin:0;background:#111;color:#ddd;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:16px}
canvas{max-width:100%;background:#1c1c24;border-radius:8px}
button{margin:8px 4px;padding:8px 16px;border:0;border-radius:6px;background:#4a7dff;color:#fff;cursor:pointer}
#log{font-size:.9rem;opacity:.8;min-height:1.2em}
</style></head><body>
<h2>Robot World</h2>
<canvas id="c" width="480" height="480"></canvas>
<div><button id="step">Step</button><button id="run">Run</button><button id="reset">Reset</button></div>
<div id="log"></div>
<script>
const N = 12, S = 40, ctx = document.getElementById('c').getContext('2d');
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];

// Base class: every robot has a position, facing and a way to act each turn
class Robot {
  constructor(world, x, y, color, name) { Object.assign(this, {world, x, y, color, name, dir: 0, broken: false}); }
  ahead() { const [dx, dy] = DIRS[this.dir]; return [this.x + dx, this.y + dy]; }
  spin() { this.dir = (this.dir + 1) % 4; }
  tryMove() {
    const [nx, ny] = this.ahead();
    if (this.world.isFree(nx, ny)) { this.x = nx; this.y = ny; return true; }
    const other = this.world.robotAt(nx, ny);
    if (other) { other.broken = true; this.world.log(`${this.name} bumped ${other.name}!`); }
    return false;
  }
  takeTurn() { if (!this.broken) this.act(); }
  act() {}
}
// Subclasses override act(): polymorphism in action
class Spinbot extends Robot { act() { this.spin(); } }
class Nosebot extends Robot { act() { for (let i = 0; i < 4 && !this.tryMove(); i++) this.spin(); } }
class Staggerbot extends Robot { act() { this.dir = Math.floor(Math.random() * 4); this.tryMove(); } }
class Lovebot extends Robot {
  constructor(w, x, y, c, n, target) { super(w, x, y, c, n); this.target = target; }
  act() {
    const dx = this.target.x - this.x, dy = this.target.y - this.y;
    this.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    this.tryMove();
  }
}

class World {
  constructor() {
    this.walls = new Set();
    for (let i = 0; i < 18; i++) this.walls.add(`${rand(N)},${rand(N)}`);
    const nose = new Nosebot(this, 1, 1, '#4fd18b', 'Nosebot');
    this.robots = [nose,
      new Spinbot(this, 6, 6, '#ffcc4d', 'Spinbot'),
      new Staggerbot(this, 10, 2, '#b07cff', 'Staggerbot'),
      new Lovebot(this, 10, 10, '#ff6b8a', 'Lovebot', nose)];
    this.robots.forEach(r => this.walls.delete(`${r.x},${r.y}`));
    this.turn = 0;
  }
  robotAt(x, y) { return this.robots.find(r => r.x === x && r.y === y); }
  isFree(x, y) { return x >= 0 && y >= 0 && x < N && y < N && !this.walls.has(`${x},${y}`) && !this.robotAt(x, y); }
  log(m) { document.getElementById('log').textContent = `Turn ${this.turn}: ${m}`; }
  step() { this.turn++; this.robots.forEach(r => r.takeTurn()); }
}
const rand = n => Math.floor(Math.random() * n);

function draw(w) {
  ctx.clearRect(0, 0, 480, 480);
  ctx.fillStyle = '#3a3a48';
  w.walls.forEach(k => { const [x, y] = k.split(',').map(Number); ctx.fillRect(x*S+2, y*S+2, S-4, S-4); });
  for (const r of w.robots) {
    const cx = r.x*S + S/2, cy = r.y*S + S/2, [dx, dy] = DIRS[r.dir];
    ctx.fillStyle = r.broken ? '#555' : r.color;
    ctx.beginPath(); ctx.arc(cx, cy, S/2.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + dx*S/3, cy + dy*S/3); ctx.stroke();
  }
}

let world = new World(), timer = null;
const tick = () => { world.step(); draw(world); };
document.getElementById('step').onclick = tick;
document.getElementById('run').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = 'Run'; }
  else { timer = setInterval(tick, 300); e.target.textContent = 'Pause'; }
};
document.getElementById('reset').onclick = () => { world = new World(); draw(world); world.log('New world'); };
draw(world);
</script></body></html>
